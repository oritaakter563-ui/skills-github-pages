
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的紫色小世界</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eadcff, #c9a7f5, #f5eaff);
      color: #49336b;
      text-align: center;
      min-height: 100vh;
    }

    header {
      padding: 70px 20px 40px;
    }

    h1 {
      font-size: 38px;
      color: #7041a6;
    }

    .card {
      background: white;
      margin: 20px auto;
      padding: 25px;
      border-radius: 20px;
      max-width: 500px;
      width: 80%;
      box-shadow: 0 5px 20px #8e65b333;
    }

    h2 {
      color: #8755bd;
    }

    footer {
      padding: 30px;
      color: #7041a6;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ 欢迎来到我的小世界 💜</h1>
    <p>一个充满梦想与美好的地方</p>
  </header>

  <section class="card">
    <h2>🌸 关于我</h2>
    <p>你好！欢迎认识我。</p>
    <p>我喜欢学习、探索新事物和创造美好。</p>
  </section>

  <section class="card">
    <h2>💜 我的兴趣</h2>
    <p>阅读 · 音乐 · 旅行 · 学习</p>
  </section>

  <section class="card">
    <h2>🌟 我的梦想</h2>
    <p>每天进步一点点，勇敢实现自己的梦想。</p>
  </section>

  <footer>
    Made with 💜 by Me
  </footer>

</body>
</html>
